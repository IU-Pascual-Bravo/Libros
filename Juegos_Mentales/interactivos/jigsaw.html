
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pack de Puzles</title>
  <style>
  
        body {
            margin: 0;
            padding: 0;
            border: none;
            font-family: sans-serif;
            overflow: hidden;
        }

        #controles {
            background-color: #f0f0f0;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px 15px;
            border-bottom: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 60000;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #controles label,
        #controles .separator {
            font-weight: bold;
            color: #333;
        }

        #controles input,
        #controles select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        #statusMessage {
            font-weight: bold;
            color: #6f42c1;
            width: 100%;
            text-align: center;
            margin-top: 10px;
            min-height: 1.2em;
        }

        #controles button {
            padding: 8px 15px;
            border-radius: 4px;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        #controles button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        #startBtn {
            background-color: #fd7e14;
        }

        #startBtn:hover:not(:disabled) {
            background-color: #e86a02;
        }

        #crearUrlBtn {
            background-color: #007bff;
        }

        #crearUrlBtn:hover {
            background-color: #0056b3;
        }

        #uploadBtn {
            background-color: #17a2b8;
        }

        #uploadBtn:hover {
            background-color: #117a8b;
        }

        #crearAiBtn {
            background-color: #6f42c1;
        }

        #crearAiBtn:hover {
            background-color: #5a32a3;
        }

        #descargarBtn {
            background-color: #28a745;
        }

        #descargarBtn:hover:not(:disabled) {
            background-color: #1e7e34;
        }

        #thumbnailColumn {
            position: fixed;
            left: 0;
            top: 0;
            width: 100px;
            height: 100%;
            background: #e9ecef;
            padding-top: 10px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 50000;
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s ease-in-out;
            transform: translateX(-100%);
        }

        #thumbnailColumn.visible {
            transform: translateX(0);
        }

        #thumbnailColumn img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 2px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        #thumbnailColumn img:hover {
            transform: scale(1.1);
            border-color: #007bff;
        }

        #thumbnailColumn img.active {
            border-color: #fd7e14;
            box-shadow: 0 0 10px rgba(253, 126, 20, 0.7);
        }

        #puzzleContainer {
            width: 100%;
            margin-left: 0;
            position: relative;
            transition: margin-left 0.3s ease-in-out;
        }

        #puzzleContainer.shifted {
            width: calc(100% - 100px);
            margin-left: 100px;
        }

        #forPuzzle {
            border: none;
            left: 0px;
            top: 0px;
            position: relative;
        }

        #forPuzzle>div {
            transition: transform 0.2s ease-out;
        }

        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 70000;
            flex-direction: column;
            gap: 20px;
            font-size: 1.2em;
            color: #333;
        }

        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #6f42c1;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .api-key-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        #apiKeyInput {
            border: none;
            outline: none;
            width: 150px;
            font-family: monospace;
        }

        #getApiKeyBtn {
            background-color: #6c757d !important;
            padding: 5px 10px !important;
            font-size: 0.9em;
        }

        #getApiKeyBtn:hover {
            background-color: #5a6268 !important;
        }

        #apiKeyForm {
            margin: 0;
            padding: 5px 10px;
        }
    
  #controles, #loadingOverlay { display: none !important; }
  body { overflow: hidden; } 
  </style>
</head>
<body>
  <div id="thumbnailColumn"></div>

      <div id="forPuzzle"></div>
  </div>

let currentNpieces = 25;

function handleZoom(event) {
    if (!puzleActual || !puzleActual.divGame) return;
    event.preventDefault();
    const puzzleContainer = document.getElementById('puzzleContainer');
    const rect = puzzleContainer.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    const delta = event.deltaY > 0 ? 0.9 : 1.1;
    const newScale = currentScale * delta;
    currentScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
    puzleActual.divGame.style.transformOrigin = `${x}px ${y}px`;
    puzleActual.divGame.style.transform = `scale(${currentScale})`;
}

function iniciarPuzle(imageIndex) {
    if (imageIndex < 0 || imageIndex >= puzzlePackData.length) return;
    const puzzleData = puzzlePackData[imageIndex];
    
    const puzzleContainer = document.getElementById('puzzleContainer');
    const forPuzzleDiv = document.getElementById('forPuzzle');
    forPuzzleDiv.innerHTML = '';
    if (puzleActual && puzleActual.divGame) {
      puzleActual.divGame.style.transform = 'scale(1)';
      puzleActual.divGame.style.transformOrigin = 'center center';
    }
    currentScale = 1;
    autoStart = 1;
    currentNpieces = puzzleData.npieces;

    const availableHeight = window.innerHeight;
    puzzleContainer.style.height = `${availableHeight}px`;
    puzzleContainer.removeEventListener('wheel', handleZoom);
    
    puzleActual = new Puzzle({
        img: puzzleData.src,
        width: puzzleContainer.clientWidth,
        height: availableHeight,
        idiv: "forPuzzle"
    });
    
    puzzleContainer.addEventListener('wheel', handleZoom, { passive: false });
    
    document.querySelectorAll('#thumbnailColumn img').forEach(img => {
        img.classList.toggle('active', parseInt(img.dataset.index) === imageIndex);
    });
}

function setupThumbnails() {
    const thumbnailColumn = document.getElementById('thumbnailColumn');
    thumbnailColumn.classList.add('visible');
    puzzlePackData.forEach((data, index) => {
        const img = document.createElement('img');
        img.src = data.src;
        img.dataset.index = index;
        img.title = `Puzle ${index + 1} (${data.npieces} piezas)`;
        img.addEventListener('click', () => iniciarPuzle(index));
        thumbnailColumn.appendChild(img);
    });
}

function handleResize() {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
        const activeThumb = document.querySelector('#thumbnailColumn img.active');
        const activeIndex = activeThumb ? parseInt(activeThumb.dataset.index) : 0;
        iniciarPuzle(activeIndex);
    }, 250);
}

// Sobrescribimos la función createPuzzle para ajustar alturas en el clon
Puzzle.prototype.createPuzzle = function(params){
    let wi = this.image.width; let he = this.image.height;
    this.reqHeight = params.height; this.reqWidth = params.width;
    this.height = this.reqHeight - 2 * Puzzle.MARGIN1; this.width = this.reqWidth - 2 * Puzzle.MARGIN1;
    if (wi / he > this.width / this.height) { this.height = this.width * he / wi; } else { this.width = this.height * wi / he; }
    if (typeof(params.idiv) == 'string') { this.divGame = document.getElementById(params.idiv); } else { this.divGame = params.idiv; }
    this.divGame.style.overflow = "visible"; this.divGame.style.position = "relative";
    if (!this.divBoard) { this.divBoard = document.createElement('div'); this.divGame.appendChild(this.divBoard); } else { this.divBoard.innerHTML = ''; this.divGame.appendChild(this.divBoard); }
    this.divBoard.style.overflow = "hidden"; this.divBoard.style.position = "absolute"; this.divBoard.style.left = 0; this.divBoard.style.top = 0;
    this.listeners = [];
    this.divGame.style.width = this.divBoard.style.width = this.width + 2 * Puzzle.MARGIN1 + "px";
    this.divGame.style.height = this.divBoard.style.height = this.height + 2 * Puzzle.MARGIN1 + "px";
    if (!this.canvMobile) { this.canvMobile = document.createElement('canvas'); this.divBoard.appendChild(this.canvMobile); }
    this.canvMobile.style.visibility = "visible"; this.canvMobile.width = parseFloat(this.divBoard.style.width); this.canvMobile.height = parseFloat(this.divBoard.style.height);
    this.canvMobile.style.position = "absolute"; this.canvMobile.style.top = "0px"; this.canvMobile.style.left = "0px"; this.canvMobile.style.zIndex = 50000;
    this.dCoupling = 10;
    this.canvMobile.getContext("2d").drawImage(this.image, 0, 0, wi, he, Puzzle.MARGIN1, Puzzle.MARGIN1, this.width, this.height);
    if (autoStart) { this.npieces = currentNpieces; this.next(); }
};

window.addEventListener("load", function(){
    document.getElementById('puzzleContainer').classList.add('shifted');
    setupThumbnails();
    iniciarPuzle(0);
    window.addEventListener('resize', handleResize);
});
    
  </script>
